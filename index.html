<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Madam Ji 🌸</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(180deg,#ffd6ec,#ffeaf6,#fff6fb);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
}

/* Lily garden background */
.garden{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:180px;
    overflow:hidden;
}

.flower{
    position:absolute;
    bottom:-10px;
    font-size:42px;
    animation:sway 3s ease-in-out infinite;
    transform-origin:bottom center;
}

@keyframes sway{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
}

/* Floating petals */
.petal{
    position:absolute;
    font-size:22px;
    opacity:0.7;
    animation:petalFall linear infinite;
}

@keyframes petalFall{
    from{
        transform:translateY(-120px) rotate(0deg);
        opacity:0;
    }
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:1;
    }
}

/* Floating cats */
.cat{
    position:absolute;
    font-size:32px;
    opacity:0.5;
    animation:catFloat linear infinite;
}

@keyframes catFloat{
    from{
        transform:translateY(110vh);
    }
    to{
        transform:translateY(-120px);
    }
}

/* Card */
.card{
    width:360px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 12px 35px rgba(255,105,180,0.25);
    position:relative;
    z-index:10;
    animation:cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.ribbon{
    position:absolute;
    top:-12px;
    right:18px;
    background:#ff8fc4;
    color:white;
    padding:7px 15px;
    border-radius:999px;
    font-size:13px;
}

h1{
    color:#ff5fa2;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    margin-bottom:22px;
}

.question{
    font-size:22px;
    color:#ff4f9a;
    margin-bottom:22px;
    min-height:64px;
    transition:opacity .4s ease;
}

.buttons{
    position:relative;
    height:210px;
}

.btn{
    width:140px;
    border:none;
    border-radius:18px;
    padding:10px;
    cursor:pointer;
    position:absolute;
    transition:.25s ease;
}

#yesBtn{
    left:18px;
    top:30px;
    background:#ffd1e8;
    animation:bounce 1.8s infinite;
}

#yesBtn:hover{
    transform:scale(1.08);
}

#noBtn{
    right:18px;
    top:30px;
    background:#ffe5f2;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

.btn img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:14px;
    margin-top:8px;
}

#result{
    display:none;
    margin-top:20px;
    color:#ff4f9a;
    font-size:18px;
    font-weight:bold;
    animation:pop .5s ease;
}

@keyframes pop{
    from{transform:scale(.8);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.small{
    margin-top:12px;
    color:#888;
    font-size:14px;
}

.confetti{
    position:absolute;
    width:10px;
    height:16px;
    border-radius:3px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-40px) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(100vh) rotate(540deg);
        opacity:0;
    }
}
</style></head><body><div class="card"><div class="ribbon">Pookie Madam Ji 🎀</div><h1>Hi Mayera 🌸</h1><p class="subtitle">
A tiny pink garden made specially for Madam Ji.
</p><div class="question" id="question">
Madam Ji 🌸 did you smile today? 😊
</div><div class="buttons" id="playArea"><button class="btn" id="yesBtn">
<div><b>Yes 💗</b></div>
<img src="happy.gif" alt="Happy cat">
</button><button class="btn" id="noBtn">
<div><b>No 🌷</b></div>
<img src="sad.gif" alt="Sad cat">
</button></div><div id="result"></div><div class="small">
Pink lilies, tiny cats, and one wholesome mission 🌸
</div></div><div class="garden" id="garden"></div><script>
const noBtn=document.getElementById("noBtn");
const playArea=document.getElementById("playArea");
const yesBtn=document.getElementById("yesBtn");
const result=document.getElementById("result");
const question=document.getElementById("question");

const questions=[
    "Madam Ji 🌸 did you smile today? 😊",
    "Madam Ji 🍚 promise you ate properly today? 🥺",
    "Madam Ji 😾 did anyone annoy Madam Ji today?",
    "Madam Ji 🌷 will you let me be by your side? 💖",
    "Madam Ji 🫶 promise you'll let me be by your side even in your hard times? 🌸"
];

let currentQuestion=0;

function moveNoButton(){
    const areaRect=playArea.getBoundingClientRect();
    const btnRect=noBtn.getBoundingClientRect();

    const maxX=areaRect.width-btnRect.width;
    const maxY=areaRect.height-btnRect.height;

    noBtn.style.left=Math.random()*maxX+"px";
    noBtn.style.top=Math.random()*maxY+"px";
    noBtn.style.right="auto";
}

noBtn.addEventListener("mouseenter",moveNoButton);
noBtn.addEventListener("touchstart",e=>{
    e.preventDefault();
    moveNoButton();
});

yesBtn.addEventListener("click",()=>{
    question.style.opacity=0;

    setTimeout(()=>{
        currentQuestion++;

        if(currentQuestion<questions.length){
            question.innerHTML=questions[currentQuestion];
            question.style.opacity=1;
            heartBurst();
        }else{
            document.querySelector(".buttons").style.display="none";
            question.style.display="none";
            result.style.display="block";
            result.innerHTML=
            "YAYYYY, Madam Ji! 🌸🎀<br><br>"+
            "You have officially unlocked <b>Pookie Madam Ji Mode</b> 💖<br><br>"+
            "Thank you for being you. Please keep smiling, eat properly, rest well, and remember that I'd always want to be by your side. 🐱🌷";
            confettiBurst();
        }
    },250);
});

function heartBurst(){
    for(let i=0;i<12;i++){
        const h=document.createElement("div");
        h.innerHTML=["💗","🌸","🎀"][Math.floor(Math.random()*3)];
        h.style.position="absolute";
        h.style.left=(45+Math.random()*10)+"%";
        h.style.top="50%";
        h.style.fontSize=(18+Math.random()*10)+"px";
        h.style.transition="1s ease-out";
        document.body.appendChild(h);

        setTimeout(()=>{
            h.style.transform=`translate(${(Math.random()-0.5)*220}px,-${120+Math.random()*120}px)`;
            h.style.opacity="0";
        },20);

        setTimeout(()=>h.remove(),1100);
    }
}

function confettiBurst(){
    const colors=["#ff7eb9","#ffb3d9","#ffd1e8","#ff5fa2","#ffc0cb"];

    for(let i=0;i<100;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration=(2+Math.random()*2)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

/* Lily garden */
const garden=document.getElementById("garden");
for(let i=0;i<26;i++){
    const f=document.createElement("div");
    f.className="flower";
    f.innerHTML=["🌸","🌺","🪷","🌷"][Math.floor(Math.random()*4)];
    f.style.left=(i*4)+Math.random()*3+"vw";
    f.style.animationDelay=Math.random()*2+"s";
    garden.appendChild(f);
}

/* Petals */
for(let i=0;i<32;i++){
    const p=document.createElement("div");
    p.className="petal";
    p.innerHTML=["🌸","💗","🎀"][Math.floor(Math.random()*3)];
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(5+Math.random()*6)+"s";
    p.style.fontSize=(18+Math.random()*18)+"px";
    document.body.appendChild(p);
}

/* Floating cats */
for(let i=0;i<14;i++){
    const cat=document.createElement("div");
    cat.className="cat";
    cat.innerHTML=["🐱","😺","🐈"][Math.floor(Math.random()*3)];
    cat.style.left=Math.random()*100+"vw";
    cat.style.animationDuration=(8+Math.random()*8)+"s";
    cat.style.fontSize=(22+Math.random()*16)+"px";
    document.body.appendChild(cat);
}
</script></body>
</html>
